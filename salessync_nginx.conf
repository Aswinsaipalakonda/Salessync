server {
    server_name aa.thehps.in;

    client_max_body_size 50M;

    # Serve Django static files
    location /static/ {
        alias /var/www/salessync/backend/staticfiles/;
    }

    # Serve Django media files
    location /media/ {
        alias /var/www/salessync/backend/media/;
    }

    # Django Admin Panel (should always go to Django backend)
    location /admin {
        proxy_pass http://127.0.0.1:8015;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Django API endpoints (with /api/ prefix)
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8015;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Django API endpoints (non-prefixed)
    location ~ ^/(getuserdetails|resetpassword|adduser|adminlogin|updateusertype|deleteusers|addreport|getreports|addpayment|generateledger|generate_excel_ledger|import_excel_data|logout_admin|export_all_orders|get_customers|logout_user|userlogin|update_order) {
        # If the browser is requesting an HTML page directly (like page refresh or typing the URL),
        # rewrite the request to index.html so Vue Router handles the route.
        if ($http_accept ~* "html") {
            rewrite ^ /index.html last;
        }

        proxy_pass http://127.0.0.1:8015;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve Vue Frontend
    location / {
        root /var/www/salessync/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/aa.thehps.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aa.thehps.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = aa.thehps.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name aa.thehps.in;
    return 404; # managed by Certbot
}
